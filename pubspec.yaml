name: script_to_video_generator
description: An Android-focused, local-first script-to-video generator using native TTS, Pollinations.ai images, and FFmpeg.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.3
  http: ^1.4.0
  path_provider: ^2.1.5
  # The original package is no longer the best maintained option. This active
  # fork exposes the same FFmpegKit API and includes the GPL codecs required
  # by libx264.
  ffmpeg_kit_flutter_new: ^4.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
